<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lampa Plugin Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f0f0f;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #console {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 200px;
            overflow-y: auto;
            padding: 20px;
            background: #1a1a1a;
            font-family: monospace;
            font-size: 12px;
        }
        #console .log { color: #fff; }
        #console .info { color: #4caf50; }
        #console .warn { color: #ff9800; }
        #console .error { color: #f44336; }
        #menu {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: #222;
            padding: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .menu-item {
            padding: 15px 30px;
            background: #333;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .menu-item:hover {
            background: #e50914;
        }
        #activity-area {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 200px;
            height: 38vh;
            overflow-y: auto;
            padding: 20px;
            background: #111;
            border-top: 1px solid #333;
            z-index: 5;
            display: none;
        }
        button {
            padding: 10px 20px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            background: #333;
            color: white;
            border: 1px solid #444;
            border-radius: 5px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div id="console"></div>
    
    <div id="menu">
        <div class="menu-item" onclick="reloadPlugin()">🔄 Перезагрузить плагин</div>
        <div class="menu-item" onclick="clearConsole()">🗑️ Очистить консоль</div>
        <div class="menu-item" onclick="showActivity()">📺 Показать Activity</div>
        <div id="lordserials-test-btn" class="menu-item" style="background:#e50914;display:none;">🎬 LordSerials</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    
    <script>
        // Мок Lampa API
        window.Lampa = {
            Activity: {
                push: function(params) {
                    log('[Lampa.Activity.push]', params);
                    showActivityContent(params);
                },
                backward: function() {
                    log('[Lampa.Activity.backward]');
                }
            },
            Component: {
                add: function(name, constructor) {
                    log('[Lampa.Component.add]', name);
                    window.Lampa._components = window.Lampa._components || {};
                    window.Lampa._components[name] = constructor;
                }
            },
            Controller: {
                add: function(name, obj) {
                    log('[Lampa.Controller.add]', name);
                },
                toggle: function(name) {
                    log('[Lampa.Controller.toggle]', name);
                },
                focus: function(id) {
                    log('[Lampa.Controller.focus]', id);
                }
            },
            Player: {
                play: function(video) {
                    log('[Lampa.Player.play]', video, 'info');
                }
            },
            Select: {
                show: function(params) {
                    log('[Lampa.Select.show]', params && params.title ? params.title : '');
                    if (params && params.items && params.items.length && params.onSelect) {
                        params.onSelect(params.items[0]);
                    }
                }
            },
            Noty: {
                show: function(msg) {
                    log('[Lampa.Noty.show]', msg, 'info');
                    alert('Noty: ' + msg);
                }
            },
            Settings: {
                // add: function(obj) { log('[Lampa.Settings.add]', obj); } // Намеренно не добавляем
            },
            Listener: {
                follow: function(type, callback) {
                    log('[Lampa.Listener.follow]', type);
                    // Симулируем событие ready через 1 секунду
                    setTimeout(function() {
                        callback({ type: 'ready' });
                    }, 1000);
                }
            },
            Template: {
                add: function(id, html) {
                    log('[Lampa.Template.add]', id);
                },
                js: function(id) {
                    return $('<div></div>');
                }
            }
        };

        // Симулируем appready
        window.appready = true;

        // Консоль
        function log(msg, data, type) {
            var consoleEl = document.getElementById('console');
            var line = document.createElement('div');
            line.className = type || 'log';
            
            var timestamp = new Date().toLocaleTimeString();
            line.textContent = '[' + timestamp + '] ' + msg + (data ? ' ' + JSON.stringify(data) : '');
            
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
            
            // Также в браузерную консоль
            console.log(msg, data);
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }

        function showActivity() {
            var activityEl = document.getElementById('activity-area');
            if (!activityEl) {
                activityEl = document.createElement('div');
                activityEl.id = 'activity-area';
                document.body.appendChild(activityEl);
            }
            activityEl.style.display = 'block';
        }

        function showActivityContent(params) {
            log('[showActivityContent] params:', params);
            
            var activityEl = document.getElementById('activity-area');
            if (!activityEl) {
                activityEl = document.createElement('div');
                activityEl.id = 'activity-area';
                document.body.appendChild(activityEl);
            }
            
            activityEl.style.display = 'block';
            activityEl.innerHTML = '<h2>Activity: ' + (params.title || '') + '</h2>' +
                '<p>Component: ' + (params.component || '') + '</p>' +
                '<p>URL: ' + (params.url || '') + '</p>' +
                '<div id="activity-content" style="margin-top:20px;padding:20px;background:#222;min-height:300px;"></div>';
            
            // Пытаемся создать компонент
            if (window.Lampa._components && window.Lampa._components[params.component]) {
                log('[showActivityContent] Нашли компонент: ' + params.component);
                
                var ComponentClass = window.Lampa._components[params.component];
                var instance = {
                    activity: {
                        loader: function(show) {
                            log('[Activity.loader]', show);
                        }
                    },
                    html: null
                };
                
                // Создаем экземпляр компонента
                ComponentClass.call(instance, { data: params.data || {} });
                log('[showActivityContent] instance создан:', Object.keys(instance));
                
                if (instance.create) {
                    log('[Вызов component.create()]');
                    try {
                        instance.create();
                        log('[component.create()] завершен');
                    } catch(err) {
                        log('[component.create()] ошибка: ' + err.message, null, 'error');
                    }
                }
                
                if (instance.render) {
                    log('[Вызов component.render()]');
                    try {
                        var html = instance.render();
                        log('[component.render()] вернул:', html);
                        log('[component.render()] html.length:', html ? (html.length || html.jquery) : 'null');
                        log('[component.render()] html.html():', html ? (html.html ? html.html().substring(0, 200) : 'no html method') : 'null');
                        
                        // Вставляем HTML
                        if (html) {
                            // Компонент Lampa обычно возвращает jQuery/DOM, а не строку.
                            // .html(jQueryObject) в тестовом стенде может не отрисовать контент.
                            $('#activity-content').empty().append(html);
                            log('[showActivityContent] HTML вставлен');
                        }
                    } catch(err) {
                        log('[component.render()] ошибка: ' + err.message, null, 'error');
                    }
                }
                
                if (instance.start) {
                    log('[Вызов component.start()]');
                    try {
                        instance.start();
                    } catch(err) {
                        log('[component.start()] ошибка: ' + err.message, null, 'error');
                    }
                }
            } else {
                log('[showActivityContent] Компонент НЕ найден!', null, 'error');
                log('[showActivityContent] Доступные компоненты:', Object.keys(window.Lampa._components || {}));
            }
        }

        function reloadPlugin() {
            clearConsole();
            log('Перезагрузка плагина...');
            
            // Удаляем старый плагин
            delete window.lordserials_plugin;
            
            // Загружаем новый
            var script = document.createElement('script');
            script.src = 'main.js?' + Date.now();
            script.onerror = function() {
                log('Ошибка загрузки main.js', null, 'error');
            };
            document.body.appendChild(script);
        }

        // Загружаем плагин при старте
        log('Загрузка тестовой среды...');
        
        var script = document.createElement('script');
        script.src = 'main.js';
        script.onerror = function() {
            log('Ошибка загрузки main.js', null, 'error');
        };
        script.onload = function() {
            log('main.js загружен');
            // Показываем кнопку для теста
            setTimeout(function() {
                var btn = document.getElementById('lordserials-test-btn');
                if (btn) {
                    btn.style.display = 'block';
                    btn.onclick = function() {
                        log('Клик по LordSerials (test)');
                        showActivityContent({
                            url: 'lordserials',
                            title: 'LordSerials - Поиск сериалов',
                            component: 'lordserials_search',
                            page: 1
                        });
                    };
                    log('Кнопка LordSerials показана');
                }
            }, 2000);
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
